name: Release

# Publish a new pak.json version after its main-branch build succeeds.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check whether this version is already released
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          releases="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')"
          if grep -Fxq "$VERSION" <<< "$releases"; then
            echo "Release $VERSION already exists - nothing to publish."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Central.Scrutinizer.pak.zip
        if: steps.gate.outputs.release == 'true'
        uses: actions/download-artifact@v4
        with:
          name: Central-Scrutinizer-pak-zip

      - name: Verify metadata and prepare release notes
        if: steps.gate.outputs.release == 'true'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          unzip -p Central.Scrutinizer.pak.zip pak.json > packaged-pak.json
          cmp pak.json packaged-pak.json
          jq -er --arg v "$VERSION" '.changelog[$v] | select(type == "string" and length > 0)' pak.json > notes.md

      - name: Publish GitHub Release
        if: steps.gate.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" Central.Scrutinizer.pak.zip \
            --target "$GITHUB_SHA" \
            --title "Central Scrutinizer $VERSION" \
            --notes-file notes.md
          gh release view "$VERSION" --json assets --jq '.assets[].name'
